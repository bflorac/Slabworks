<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="72" height="72" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Climb only: upward cuts, returning around the left of the part</title>
  <!-- part -->
  <rect x="11" y="9" width="34" height="30" rx="2.5" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- return travel (outside the part, looping left) -->
  <path d="M16 11 V5 M22 11 V5 M28 11 V5 M34 11 V5 M40 11 V5
           M40 5 H6 V43 H40
           M22 43 V37 M28 43 V37 M34 43 V37 M40 43 V37"
        stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="2 2"/>
  <polygon points="3.6,22 8.4,22 6,26" fill="currentColor" fill-opacity="0.55"/>
  <!-- upward cuts -->
  <path d="M16 37 V17 M22 37 V17 M28 37 V17 M34 37 V17 M40 37 V17" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor">
    <polygon points="13,17 19,17 16,11"/>
    <polygon points="19,17 25,17 22,11"/>
    <polygon points="25,17 31,17 28,11"/>
    <polygon points="31,17 37,17 34,11"/>
    <polygon points="37,17 43,17 40,11"/>
  </g>
  <circle cx="16" cy="37" r="2.8" fill="#2e9e4f"/>
</svg>
